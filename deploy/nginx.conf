  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
}
server {
  listen 80;
  server_name admin.quikooo.bstk.in;
  root /usr/share/nginx/html/admin;
  index index.html;
  location /api/ { limit_req zone=api burst=20 nodelay; proxy_pass http://quikooo_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
}
server {
  listen 80;
  server_name api.quikooo.bstk.in;
  location /api/ { limit_req zone=api burst=20 nodelay; proxy_pass http://quikooo_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location = /health { proxy_pass http://quikooo_api/health; }
  location / { return 200 '{"service":"quikooo-api","docs":"/health"}'; add_header Content-Type application/json; }
}
