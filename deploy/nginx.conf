# QUIKOOO portal router — one server block per subdomain.
# Same-origin /api/v1 proxied to backend so frontends need no API_URL.
upstream quikooo_api { server quikooo-api:5001; }

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
  listen 80;
  server_name quikooo.bstk.in;
  root /usr/share/nginx/html/customer;
  index index.html;
  location /api/ { limit_req zone=api burst=20 nodelay; proxy_pass http://quikooo_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
}
server {
  listen 80;
  server_name merchant.quikooo.bstk.in;
  root /usr/share/nginx/html/merchant;
  index index.html;
  location /api/ { limit_req zone=api burst=20 nodelay; proxy_pass http://quikooo_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
}
